services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimiq-arena-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:test@db:3306/nimiq_arena
      - JWT_SECRET=nimiq-arena-production-jwt-secret-replace-with-64-char-hex
      - VITE_APP_ID=nimiq-arena-app
      - NIMIQ_NETWORK=testnet
      - NIMIQ_RPC_URL=https://rpc.testnet.nimiqwatch.com
      - NIMIQ_PAYMENT_RECIPIENT=NQ07 0000 0000 0000 0000 0000 0000 0000 0000
      - NIMIQ_ARENA_ENTRY_VALUE_LUNA=100000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: nimiq-arena-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=nimiq_arena
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
